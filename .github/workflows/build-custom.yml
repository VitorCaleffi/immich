name: Build Custom Immich

on:
  push:
    branches:
      - feat/add-token-url-support
      - main
  workflow_dispatch:
    inputs:
      build_ml:
        description: 'Build Machine Learning image'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip tests (faster build)'
        required: false
        default: false
        type: boolean

env:
  REGISTRY: ghcr.io

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate OpenAPI SDK
        run: pnpm --filter immich run sync:open-api

      - name: Build server
        run: pnpm --filter immich run build

      - name: Run server tests
        if: ${{ github.event.inputs.skip_tests != 'true' }}
        run: pnpm --filter immich run test -- --run

      - name: Build web
        run: pnpm --filter immich-web run build

      - name: Check for OpenAPI changes
        run: |
          if [ -n "$(git status --porcelain open-api/)" ]; then
            echo "::warning::OpenAPI spec has uncommitted changes. Consider committing the generated files."
            git diff open-api/
          fi

  build-server:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for server
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/immich-server
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_ID=${{ github.run_id }}
            BUILD_SOURCE_COMMIT=${{ github.sha }}
            BUILD_SOURCE_REF=${{ github.ref_name }}

  build-ml:
    needs: validate
    if: ${{ github.event.inputs.build_ml == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for ML
        id: meta-ml
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/immich-machine-learning
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push ML image (CPU)
        uses: docker/build-push-action@v5
        with:
          context: ./machine-learning
          file: ./machine-learning/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta-ml.outputs.tags }}
          labels: ${{ steps.meta-ml.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DEVICE=cpu
